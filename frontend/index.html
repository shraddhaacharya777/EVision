<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVision - EV charging Station Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Navigation-->
    <header>
        <nav>
            <h1>⚡EVision</h1>
            <div>
                <a href="#home">Home</a>
                <a href="#bookings">My booking</a>
            </div>
        </nav>
    </header>
    <!--Home/Hero section-->
    <main>
        <section id="home" class="hero">
            <div>
                <h2>Find.Charge.Go</h2>
                <p>Find EV charging station and book your charging slot easily</p>
                <button id="findStationBtn">Find Charging Station</button>
            </div>
        </section>
        <!--Charging Stations-->
        <section id="stations">
            <h2>Charging stations</h2>

            <!--Search-->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search station or location ">
                <select id="chargerFilter">
                    <option value="all">All Charger Types</option>
                    <option value="AC">AC</option>
                    <option value="DC Fast">DC Fast</option>
                    <option value="DC Ultra Fast">DC Ultra Fast</option>

                </select>
            </div>
            <!--Station Cards will be added using Javascript-->
            <div id="stationContainer">
            </div>
            <button id="loadMoreBtn">Load More Stations</button>
        </section>
        
        <!--My Bookings-->
        <section id="bookings">
            <h2>My Bookings</h2>
            <div id="bookingContainer">
                <p>No bookings yet.</p>
            </div>
            <div id="bookingFormContainer"></div>
        </section>
    </main>

    <!--Footer-->
    <footer>
        <P>
             © 2026 EVision | EV Charging Station Finder & Booking
        </P>
    </footer>
    <script src="script.js"></script>
    
</body>
</html>
